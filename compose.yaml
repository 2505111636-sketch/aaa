services:
  route-rescue:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - route_rescue_data:/app/data
volumes:
  route_rescue_data:
